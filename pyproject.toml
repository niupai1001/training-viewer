[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-viewer"
version = "1.0.0"
description = "本机运行的深度学习训练实验查看器：读取 TVLP 1.0 日志，显示实时曲线、实验对比与预测结果。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Training Viewer contributors" }]
keywords = ["training", "visualization", "experiment-tracking", "tvlp"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "watchdog>=4.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.15"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
training-viewer = "training_viewer.cli:main"

[project.urls]
Documentation = "https://example.invalid/training-viewer"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
training_viewer = ["web/**/*", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
